name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - name: Verify version matches the tag
        run: test "v$(./fade-cli --version | awk '{print $3}')" = "$GITHUB_REF_NAME"
      - run: make dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fade-cli_* dist/SHA256SUMS \
            --verify-tag --draft --title "fade cli $GITHUB_REF_NAME" \
            --notes "Download the binary for your platform, or run fade-cli update. See README for usage."
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
